---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: multi-tier-app
  labels:
    app: backend
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: backend
    tier: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: multi-tier-app
  labels:
    app: backend
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
      tier: api
  template:
    metadata:
      labels:
        app: backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: node:22-alpine
        ports:
        - containerPort: 3000
          name: http
        command: ["/bin/sh"]
        args:
          - -c
          - |
            cat > /app/server.js << 'EOF'
            const http = require('http');
            const redis = require('redis');
            
            const PORT = process.env.API_PORT || 3000;
            const REDIS_HOST = process.env.REDIS_HOST || 'redis-service';
            const REDIS_PORT = process.env.REDIS_PORT || 6379;
            const REDIS_PASSWORD = process.env.REDIS_PASSWORD;
            
            let redisClient;
            let isHealthy = false;
            
            async function initRedis() {
              try {
                redisClient = redis.createClient({
                  socket: {
                    host: REDIS_HOST,
                    port: REDIS_PORT
                  },
                  password: REDIS_PASSWORD
                });
                
                redisClient.on('error', (err) => {
                  console.error('Redis error:', err);
                  isHealthy = false;
                });
                
                redisClient.on('connect', () => {
                  console.log('Redis connected');
                  isHealthy = true;
                });
                
                await redisClient.connect();
              } catch (err) {
                console.error('Failed to connect to Redis:', err);
                isHealthy = false;
              }
            }
            
            const server = http.createServer(async (req, res) => {
              // Health check endpoints
              if (req.url === '/health/live') {
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ status: 'alive' }));
                return;
              }
              
              if (req.url === '/health/ready') {
                if (isHealthy && redisClient?.isOpen) {
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ status: 'ready', redis: 'connected' }));
                } else {
                  res.writeHead(503, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ status: 'not ready', redis: 'disconnected' }));
                }
                return;
              }
              
              // Metrics endpoint
              if (req.url === '/metrics') {
                res.writeHead(200, { 'Content-Type': 'text/plain' });
                res.end('# HELP api_requests_total Total API requests\n# TYPE api_requests_total counter\napi_requests_total 100\n');
                return;
              }
              
              // API endpoint
              if (req.url === '/api/data') {
                try {
                  const cacheKey = 'api:data';
                  let data = null;
                  
                  if (redisClient?.isOpen) {
                    data = await redisClient.get(cacheKey);
                  }
                  
                  if (!data) {
                    data = JSON.stringify({
                      message: 'Hello from backend API',
                      timestamp: new Date().toISOString(),
                      hostname: require('os').hostname(),
                      version: '1.0.0'
                    });
                    
                    if (redisClient?.isOpen) {
                      await redisClient.setEx(cacheKey, 60, data);
                    }
                  }
                  
                  res.writeHead(200, { 
                    'Content-Type': 'application/json',
                    'X-Cache': data ? 'HIT' : 'MISS'
                  });
                  res.end(data);
                } catch (err) {
                  console.error('Error:', err);
                  res.writeHead(500, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({ error: 'Internal server error' }));
                }
                return;
              }
              
              res.writeHead(404, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ error: 'Not found' }));
            });
            
            initRedis().then(() => {
              server.listen(PORT, () => {
                console.log(`Backend API listening on port ${PORT}`);
              });
            });
            EOF
            
            cd /app
            npm init -y
            npm install redis
            node server.js
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: API_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
