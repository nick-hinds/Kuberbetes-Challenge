---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: multi-tier-app
  labels:
    app: multi-tier-app
type: Opaque
stringData:
  # Redis password (base64 encoded in production)
  REDIS_PASSWORD: "redis-secure-password-change-me"
  
  # API secrets
  JWT_SECRET: "jwt-secret-key-change-me"
  API_KEY: "api-key-change-me"
  
  # Database credentials (if needed)
  DB_USERNAME: "appuser"
  DB_PASSWORD: "db-password-change-me"