---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: multi-tier-app
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend
      tier: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: multi-tier-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
      tier: web